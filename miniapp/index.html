<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>小晴面板</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #1a1b26; --card: #24283b; --text: #c0caf5; --dim: #565f89;
    --accent: #7aa2f7; --pink: #f7768e; --green: #9ece6a; --yellow: #e0af68;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f5f7; --card:#ffffff; --text:#1a1b26; --dim:#8a8fa8; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif; padding:14px; }
  .greeting { font-size:22px; font-weight:700; margin-bottom:2px; }
  .date { color:var(--dim); font-size:13px; margin-bottom:14px; }
  .card { background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .card h2 { font-size:13px; color:var(--dim); font-weight:600; margin-bottom:8px; letter-spacing:1px; }
  .weather-main { font-size:28px; font-weight:700; }
  .weather-sub { color:var(--dim); font-size:13px; margin-top:2px; }
  .todo-item { display:flex; align-items:baseline; gap:8px; padding:5px 0; font-size:14px; }
  .todo-item .check { flex-shrink:0; width:16px; text-align:center; }
  .todo-item .time { color:var(--dim); font-size:12px; flex-shrink:0; min-width:38px; }
  .todo-item.done .text { color:var(--dim); text-decoration:line-through; }
  .progress { font-size:12px; color:var(--green); margin-top:6px; }
  .profile-group { margin-bottom:12px; }
  .profile-group:last-child { margin-bottom:0; }
  .profile-label { font-size:12px; color:var(--accent); font-weight:600; margin-bottom:5px; }
  .profile-items { display:flex; flex-wrap:wrap; gap:6px; }
  .profile-item { background:rgba(122,162,247,.12); border:1px solid rgba(122,162,247,.25); border-radius:8px; padding:4px 10px; font-size:12px; line-height:1.5; }
  .profile-text { font-size:13px; line-height:1.7; color:var(--text); }
  /* 性格编辑 */
  .edit-btn { display:inline-block; margin-top:8px; background:var(--accent); color:#0f1117; border:none; border-radius:8px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; }
  .edit-btn:active { opacity:.85; }
  .modal-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:99; align-items:center; justify-content:center; }
  .modal-mask.show { display:flex; }
  .modal { background:var(--card); border-radius:14px; padding:20px; width:88%; max-width:420px; max-height:80vh; overflow-y:auto; }
  .modal h3 { font-size:15px; margin-bottom:14px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .field input, .field textarea { width:100%; background:rgba(255,255,255,.05); border:1px solid rgba(128,128,160,.3); border-radius:8px; padding:8px 10px; font-size:13px; color:var(--text); box-sizing:border-box; }
  .field textarea { min-height:60px; resize:vertical; }
  .modal-btns { display:flex; gap:10px; margin-top:16px; }
  .modal-btns button { flex:1; padding:10px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-save { background:var(--accent); color:#0f1117; }
  .btn-cancel { background:rgba(128,128,160,.2); color:var(--text); }
  .save-status { font-size:12px; margin-top:10px; text-align:center; min-height:16px; }
  .news-item { padding:6px 0; border-bottom:1px solid rgba(128,128,160,.15); font-size:13px; line-height:1.5; }
  .news-item:last-child { border-bottom:none; }
  .news-item a { color:var(--text); text-decoration:none; }
  .news-item .tag { color:var(--pink); font-size:11px; margin-right:6px; }
  .diary { font-size:13px; line-height:1.7; color:var(--text); white-space:pre-wrap; }
  .updated { text-align:center; color:var(--dim); font-size:11px; margin-top:6px; }
  .links { display:flex; gap:8px; }
  .links a { flex:1; text-align:center; background:var(--card); color:var(--accent); padding:10px; border-radius:12px; text-decoration:none; font-size:14px; font-weight:600; }
</style>
</head>
<body>
<div class="greeting" id="greeting">早上好，小林</div>
<div class="date" id="date"></div>

<div class="card"><h2>🌤 深圳南山天气</h2>
  <div class="weather-main" id="w-main">—</div>
  <div class="weather-sub" id="w-sub">加载中…</div>
</div>

<div class="card"><h2>📋 小晴今日 todo</h2><div id="todos"></div><div class="progress" id="todo-progress"></div></div>

<div class="card"><h2>📰 今日 AI 速览</h2><div id="news"></div></div>

<div class="card"><h2>🧠 小晴眼中的小林</h2><div id="profile"></div></div>

<div class="card"><h2>🌸 小晴的性格</h2><div id="persona"></div>
  <button class="edit-btn" onclick="openPersonaEditor()">✏️ 编辑性格</button>
  <div style="font-size:11px;color:var(--muted);margin-top:8px">面板版本: <span id="ver">20261104-2</span> · 看不到性格板块就是缓存了，清缓存重进</div>
</div>

<div class="card"><h2>🌙 小晴的日记</h2><div class="diary" id="diary">—</div></div>

<div class="links">
  <a href="https://webdrag0n.github.io/reports/">📄 日报归档</a>
</div>

<!-- 性格编辑弹窗 -->
<div class="modal-mask" id="personaModal">
  <div class="modal">
    <h3>🌸 编辑小晴的性格</h3>
    <div class="field"><label>怎么称呼你</label><input id="p-nickname" placeholder="小林"></div>
    <div class="field"><label>语气风格</label><input id="p-tone" placeholder="温暖、自然、像邻家女孩"></div>
    <div class="field"><label>主动关心程度</label>
      <select id="p-proactivity" style="width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(128,128,160,.3);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text);">
        <option value="高">高 — 经常主动找你聊天、分享</option>
        <option value="中">中 — 适度主动，不打扰</option>
        <option value="低">低 — 你找我我才回应</option>
      </select>
    </div>
    <div class="field"><label>小晴可以自由发挥的地方</label><textarea id="p-personality" placeholder="比如：偶尔小调皮、喜欢猫、对游戏话题很兴奋…"></textarea></div>
    <div class="field"><label>禁止事项</label><textarea id="p-forbidden" placeholder="比如：不要提醒打卡、不要罗列菜单、不要长篇大论…"></textarea></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closePersonaEditor()">取消</button>
      <button class="btn-save" onclick="savePersona()">保存</button>
    </div>
    <div class="save-status" id="saveStatus"></div>
  </div>
</div>

<div class="updated" id="updated"></div>

<script>
const h = new Date().getHours();
document.getElementById('greeting').textContent =
  h < 6 ? '夜深了，小林' : h < 12 ? '早上好，小林' : h < 18 ? '下午好，小林' : '晚上好，小林';
const wd = ['日','一','二','三','四','五','六'];
const d = new Date();
document.getElementById('date').textContent = `${d.getMonth()+1}月${d.getDate()}日 星期${wd[d.getDay()]}`;

fetch('data.json?t=' + Date.now()).then(r => r.json()).then(d => {
  if (d.weather) {
    document.getElementById('w-main').textContent = d.weather.main;
    document.getElementById('w-sub').textContent = d.weather.sub || '';
  }
  const todos = d.todos || [];
  const doneCount = todos.filter(t => t.done).length;
  document.getElementById('todos').innerHTML = todos.map(t =>
    `<div class="todo-item ${t.done ? 'done' : ''}">` +
    `<span class="check">${t.done ? '✅' : '⬜'}</span>` +
    (t.time ? `<span class="time">${t.time}</span>` : '') +
    `<span class="text">${t.text}</span></div>`).join('') ||
    '<div class="todo-item"><span class="check">⬜</span><span class="text">今天暂无安排，凌晨 4 点会排好</span></div>';
  if (todos.length) {
    document.getElementById('todo-progress').textContent =
      `已完成 ${doneCount}/${todos.length}`;
  }
  document.getElementById('news').innerHTML = (d.news||[]).map(n =>
    `<div class="news-item"><span class="tag">${n.tag||''}</span><a href="${n.url}" target="_blank">${n.title}</a></div>`).join('') || '<div class="news-item">日报还没出炉…</div>';
  // 小晴眼中的小林
  if (d.profile) {
    const groups = d.profile.groups || [];
    document.getElementById('profile').innerHTML = groups.map(g => {
      if (g.items) {
        return `<div class="profile-group"><div class="profile-label">${g.label}</div>` +
          `<div class="profile-items">${g.items.map(i => `<span class="profile-item">${i}</span>`).join('')}</div></div>`;
      }
      return `<div class="profile-group"><div class="profile-label">${g.label}</div>` +
        `<div class="profile-text">${g.text || ''}</div></div>`;
    }).join('');
  }
  if (d.diary) document.getElementById('diary').textContent = d.diary;
  // 小晴的性格
  if (d.persona) {
    const p = d.persona;
    document.getElementById('persona').innerHTML =
      `<div class="profile-group"><div class="profile-label">怎么称呼你</div><div class="profile-text">${p.nickname || '小林'}</div></div>` +
      `<div class="profile-group"><div class="profile-label">语气风格</div><div class="profile-text">${p.tone || '温暖、自然、像邻家女孩'}</div></div>` +
      `<div class="profile-group"><div class="profile-label">主动关心程度</div><div class="profile-text">${p.proactivity || '中'}</div></div>` +
      (p.personality ? `<div class="profile-group"><div class="profile-label">性格特点</div><div class="profile-text">${p.personality}</div></div>` : '') +
      (p.forbidden ? `<div class="profile-group"><div class="profile-label">禁止事项</div><div class="profile-text">${p.forbidden}</div></div>` : '');
  }
  if (d.updated_at) document.getElementById('updated').textContent = '小晴更新于 ' + d.updated_at;
}).catch(() => {
  document.getElementById('w-main').textContent = '加载失败';
});

// ===== 性格编辑 =====
const tg = window.Telegram && window.Telegram.WebApp;
let currentPersona = {};

function openPersonaEditor() {
  fetch('data.json?t=' + Date.now()).then(r => r.json()).then(d => {
    currentPersona = d.persona || {};
    document.getElementById('p-nickname').value = currentPersona.nickname || '小林';
    document.getElementById('p-tone').value = currentPersona.tone || '温暖、自然、像邻家女孩';
    document.getElementById('p-proactivity').value = currentPersona.proactivity || '中';
    document.getElementById('p-personality').value = currentPersona.personality || '';
    document.getElementById('p-forbidden').value = currentPersona.forbidden || '';
    document.getElementById('personaModal').classList.add('show');
  });
}

function closePersonaEditor() {
  document.getElementById('personaModal').classList.remove('show');
  document.getElementById('saveStatus').textContent = '';
}

function savePersona() {
  const data = {
    type: 'persona_update',
    nickname: document.getElementById('p-nickname').value.trim(),
    tone: document.getElementById('p-tone').value.trim(),
    proactivity: document.getElementById('p-proactivity').value,
    personality: document.getElementById('p-personality').value.trim(),
    forbidden: document.getElementById('p-forbidden').value.trim(),
  };
  const status = document.getElementById('saveStatus');
  if (tg && tg.sendData) {
    tg.sendData(JSON.stringify(data));
    status.style.color = 'var(--green)';
    status.textContent = '✓ 已保存，小晴会记住的';
    setTimeout(closePersonaEditor, 1200);
  } else {
    status.style.color = 'var(--accent)';
    status.textContent = '需要从 Telegram 里打开面板才能保存';
  }
}
try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch(e) {}
</script>
</body>
</html>
